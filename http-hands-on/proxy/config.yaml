static_resources:
  listeners:
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http_ingress
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: legacy_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: go_httpbin
                            timeout: 15s
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        demo_jwt:
                          issuer: "http-hands-on"
                          audiences:
                            - "http-hands-on-client"
                          local_jwks:
                            inline_string: '{"keys":[{"kty":"oct","alg":"HS256","use":"sig","kid":"demo-key","k":"bG9jYWwtZGVtby1zZWNyZXQtY2hhbmdlLWJlZm9yZS11c2U"}]}'
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                      rules:
                        - match:
                            prefix: "/"
                          requires:
                            provider_name: demo_jwt
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: go_httpbin
      type: STRICT_DNS
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: go_httpbin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: go-httpbin
                      port_value: 8080

admin:
  access_log_path: /tmp/envoy_admin_access.log
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
