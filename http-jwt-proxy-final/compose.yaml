services:
  legacy:
    image: ghcr.io/mccutchen/go-httpbin:latest
    command: ["-port=8081"]
    expose:
      - "8081"
    networks:
      - internal
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  proxy:
    build: .
    environment:
      LISTEN_ADDR: ":8080"
      UPSTREAM_URL: "http://legacy:8081"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required; copy .env.example to .env}"
      JWT_ISSUER: "${JWT_ISSUER:-http-hands-on}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-legacy-api}"
    ports:
      - "${PROXY_HTTP_PORT:-80}:8080"
    depends_on:
      - legacy
    networks:
      - edge
      - internal
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  token:
    build: .
    command: ["/bin/token"]
    profiles: ["tools"]
    environment:
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required; copy .env.example to .env}"
      JWT_ISSUER: "${JWT_ISSUER:-http-hands-on}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-legacy-api}"
    networks:
      - internal

networks:
  edge:
  internal:
    internal: true
